[package]
name = "gym-heart-rate"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Local Fitbit BLE heart-rate receiver and Raspberry Pi LCD display"

[dependencies]
anyhow = "1"
btleplug = "0.11.8"
futures-util = "0.3"
rppal = "0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
uuid = "1"

[profile.release]
strip = true
