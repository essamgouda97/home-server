services:

  # ─── CREATIVE STORAGE AND SMART HOME ────────────────
  creative-init:
    image: home-server/samba:local
    build: ./containers/samba
    profiles: [setup]
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        install -d -o 1000 -g 1000 -m 0770 /creative
        for folder in Projects Assets Exports ProjectBackups Incoming; do
          install -d -o 1000 -g 1000 -m 0770 "/creative/$$folder"
        done
        install -d -o 1000 -g 1000 -m 0700 /state/filebrowser /state/samba /state/homeassistant
    volumes:
      - ${CREATIVE_ROOT:-/srv/mergerfs/ssd/creative}:/creative
      - ${SERVER_DATA_DIR:-/mnt/server}/filebrowser:/state/filebrowser
      - ${SERVER_DATA_DIR:-/mnt/server}/samba:/state/samba
      - ${SERVER_DATA_DIR:-/mnt/server}/homeassistant:/state/homeassistant

  samba:
    build: ./containers/samba
    image: home-server/samba:local
    container_name: samba
    restart: unless-stopped
    ports:
      - "${SERVER_IP:-10.0.0.182}:445:445"
    volumes:
      - type: bind
        source: ${CREATIVE_ROOT:-/srv/mergerfs/ssd/creative}
        target: /shares/Creative
        bind:
          create_host_path: false
      - ./config/samba/smb.conf:/etc/samba/smb.conf:ro
      - ${SERVER_DATA_DIR:-/mnt/server}/samba:/var/lib/samba
    secrets:
      - creative_password
    networks:
      - creative
    healthcheck:
      test: ["CMD-SHELL", "smbcontrol smbd ping >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

  filebrowser:
    image: filebrowser/filebrowser:v2.63.23@sha256:a469ea076d4a1b4b1d86a41d130f2f536cd9da996a2b1fb39c0d7635f9d89b9a
    container_name: filebrowser
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    entrypoint: ["/bin/filebrowser"]
    command: ["--config", "/config/settings.json"]
    ports:
      - "${SERVER_IP:-10.0.0.182}:8082:8080"
    volumes:
      - type: bind
        source: ${CREATIVE_ROOT:-/srv/mergerfs/ssd/creative}
        target: /srv/Creative
        bind:
          create_host_path: false
      - type: bind
        source: ${SERVER_HOME:-/home/egouda}/workspace
        target: /srv/Code
        bind:
          create_host_path: false
      - type: bind
        source: ${SERVER_HOME:-/home/egouda}/repos
        target: /srv/Repositories
        bind:
          create_host_path: false
      - type: bind
        source: ${SERVER_DATA_DIR:-/mnt/server}/media
        target: /srv/Media
        bind:
          create_host_path: false
      - type: bind
        source: ${SERVER_DATA_DIR:-/mnt/server}/downloads
        target: /srv/Downloads
        bind:
          create_host_path: false
      - type: bind
        source: ${SERVER_HOME:-/home/egouda}
        target: /srv/Home
        bind:
          create_host_path: false
      - type: bind
        source: ${SERVER_STORAGE:-/mnt}
        target: /srv/Storage
        bind:
          create_host_path: false
      - ${SERVER_DATA_DIR:-/mnt/server}/filebrowser:/database
      - ./config/filebrowser/settings.json:/config/settings.json:ro
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  codex-home:
    build: ./containers/codex-home
    image: home-server/codex-home:local
    container_name: codex-home
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    ports:
      - "127.0.0.1:18790:18790"
    volumes:
      - ${HOME_SERVER_SECRETS_DIR:-/home/egouda/.config/home-server/secrets}/codex-home-auth:/home/node/.codex
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
      - /agent:rw,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0700
    secrets:
      - codex_home_token
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks:
      - assistant
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.9.2@sha256:a1bc133af84ee6505fe2c266d9805b7c75b780dfdc188edfee3b11e8f3cd8efe
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 60s
    environment:
      TZ: ${TZ:-America/Edmonton}
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/homeassistant:/config
      - ./config/homeassistant/configuration.yaml:/config/configuration.yaml:ro
      - ./config/homeassistant/packages:/config/packages:ro
      - ./config/homeassistant/blueprints:/config/blueprints/automation/home-server:ro
      - ./config/homeassistant/custom_components/codex_home:/config/custom_components/codex_home:ro
      - /etc/localtime:/etc/localtime:ro
    secrets:
      - codex_home_token
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://${SERVER_IP:-10.0.0.182}:8123/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ─── VPN ────────────────────────────────────────────
  vpn:
    container_name: vpn-gateway
    image: dperson/openvpn-client
    restart: unless-stopped
    ports:
      - 90:80
      - 6881:6881
      - 6881:6881/udp
      - 15080:15080
      - 1080:1080
    dns:
      - 8.8.8.8
      - 8.8.4.4
    cap_add:
      - NET_ADMIN
    devices:
      - '/dev/net/tun:/dev/net/tun:rwm'
    environment:
      FIREWALL: ''
      PUID: 1000
      PGID: 1000
      TZ: UTC+0
      ROUTE: '${LAN_SUBNET:-10.0.0.0/24}'
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - label:disable
    stdin_open: true
    tty: true
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/vpn:/vpn

  # ─── INFRASTRUCTURE ─────────────────────────────────
  portainer:
    image: portainer/portainer-ce
    container_name: portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SERVER_DATA_DIR:-/mnt/server}/portainer/data:/data
    ports:
      - "9000:9000"
    networks:
      - proxy
    restart: unless-stopped

  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    restart: unless-stopped
    depends_on:
      dnsmasq:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "81:81"        # Admin UI
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/npm/data:/data
      - ${SERVER_DATA_DIR:-/mnt/server}/npm/letsencrypt:/etc/letsencrypt
    networks:
      - proxy

  dnsmasq:
    image: jpillora/dnsmasq
    container_name: dnsmasq
    restart: "no"  # managed by systemd (dnsmasq-docker.service) to ensure network is ready
    # This image's BusyBox nslookup uses resolv.conf even with a server argument.
    dns:
      - 127.0.0.1
    ports:
      - "${SERVER_IP:-10.0.0.182}:53:53/udp"
      - "${SERVER_IP:-10.0.0.182}:53:53/tcp"
      - "127.0.0.1:5380:8080"    # Admin UI through SSH tunnel
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "nslookup home.lan 127.0.0.1 >/dev/null 2>&1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - proxy

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Edmonton}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * *   # 4 AM daily
      - WATCHTOWER_NOTIFICATIONS=shoutrrr
      - WATCHTOWER_MONITOR_ONLY=true       # Notify only, don't auto-update
      - DOCKER_API_VERSION=1.44            # Compatible with Docker Engine 29
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - proxy

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    restart: unless-stopped
    ports:
      - "3000:7575"
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/homarr/appdata:/appdata
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=America/Edmonton
      - AUTH_PROVIDER=credentials
      - AUTH_SECRET=${HOMARR_AUTH_SECRET}
      - SECRET_ENCRYPTION_KEY=${HOMARR_ENCRYPTION_KEY}
    networks:
      - proxy

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/uptimekuma/data:/app/data
    networks:
      - proxy

  # ─── MEDIA MANAGEMENT ──────────────────────────────
  sonarr:
    image: linuxserver/sonarr
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-America/Edmonton}
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/sonarr/data:/config
      - ${SERVER_DATA_DIR:-/mnt/server}/media/tvshows:/tv
      - ${SERVER_DATA_DIR:-/mnt/server}/downloads:/downloads
    ports:
      - "8989:8989"
    networks:
      - proxy
    restart: unless-stopped

  radarr:
    image: linuxserver/radarr
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-America/Edmonton}
      - UMASK=022
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/radarr/config:/config
      - ${SERVER_DATA_DIR:-/mnt/server}/media/movies:/movies
      - ${SERVER_DATA_DIR:-/mnt/server}/downloads:/downloads
    ports:
      - "7878:7878"
    networks:
      - proxy
    restart: unless-stopped

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    restart: unless-stopped
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/recyclarr/config:/config
    environment:
      - TZ=${TZ:-America/Edmonton}
    networks:
      - proxy

  # ─── MEDIA STREAMING ───────────────────────────────
  jellyfin:
    image: ghcr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    runtime: nvidia
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-America/Edmonton}
      - UMASK_SET=022
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/jellyfin/config:/config
      - ${SERVER_DATA_DIR:-/mnt/server}/media/tvshows:/data/tvshows
      - ${SERVER_DATA_DIR:-/mnt/server}/media/movies:/data/movies
      - ${SERVER_DATA_DIR:-/mnt/server}/media/m3u:/data/m3u
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "8096:8096"
    networks:
      - proxy
    restart: always

  jellyfin-vue:
    image: jellyfin/jellyfin-vue:unstable
    container_name: jellyfin-vue
    restart: unless-stopped
    ports:
      - "8097:80"
    networks:
      - proxy

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ:-America/Edmonton}
      - PORT=5055
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/jellyseerr/config:/app/config
    ports:
      - "5055:5055"
    networks:
      - proxy
    restart: always

  # ─── DOWNLOAD CLIENTS ──────────────────────────────
  qbittorrent:
    image: linuxserver/qbittorrent
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK_SET=022
      - WEBUI_PORT=15080
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/qbittorrent/config:/config
      - ${SERVER_DATA_DIR:-/mnt/server}/downloads:/downloads
    network_mode: "service:vpn"
    depends_on:
      - vpn
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped

  nzbget:
    image: ghcr.io/linuxserver/nzbget
    container_name: nzbget
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-America/Edmonton}
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/nzbget/config:/config
      - ${SERVER_DATA_DIR:-/mnt/server}/downloads:/downloads
    ports:
      - "6789:6789"
    networks:
      - proxy
    restart: unless-stopped

  # ─── INDEXERS ───────────────────────────────────────
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=${TZ:-America/Edmonton}
    ports:
      - "${PORT:-8191}:8191"
    networks:
      - proxy
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-America/Edmonton}
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/prowlarr/data:/config
    ports:
      - "9696:9696"
    networks:
      - proxy
    restart: unless-stopped

  # ─── TRANSCODING ────────────────────────────────────
  #   tdarr:
  #     image: ghcr.io/haveagitgat/tdarr:latest
  #     container_name: tdarr
  #     restart: unless-stopped
  #     runtime: nvidia
  #     environment:
  #       - PUID=1000
  #       - PGID=1000
  #       - TZ=${TZ:-America/Edmonton}
  #       - UMASK_SET=002
  #       - serverIP=0.0.0.0
  #       - serverPort=8266
  #       - webUIPort=8265
  #       - internalNode=true
  #       - inContainer=true
  #       - ffmpegVersion=7
  #       - nodeName=HomeServer
  #       - NVIDIA_VISIBLE_DEVICES=all
  #       - NVIDIA_DRIVER_CAPABILITIES=all
  #     volumes:
  #       - ${SERVER_DATA_DIR:-/mnt/server}/tdarr/server:/app/server
  #       - ${SERVER_DATA_DIR:-/mnt/server}/tdarr/configs:/app/configs
  #       - ${SERVER_DATA_DIR:-/mnt/server}/tdarr/logs:/app/logs
  #       - ${SERVER_DATA_DIR:-/mnt/server}/tdarr/temp:/temp
  #       - ${SERVER_DATA_DIR:-/mnt/server}/media/movies:/media/movies
  #       - ${SERVER_DATA_DIR:-/mnt/server}/media/tvshows:/media/tvshows
  #     devices:
  #       - /dev/dri:/dev/dri
  #     ports:
  #       - "8265:8265"    # Web UI
  #       - "8266:8266"    # Server
  #     networks:
  #       - proxy
  # 
  # ─── NETWORKING ──────────────────────────────────────

  # ─── MONITORING ─────────────────────────────────────
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Edmonton
      - APP_KEY=base64:YSDEfeRv6fLBeIWgp7dsI8ANb2w/OYgBY5dqZPnuQAI=
      - SPEEDTEST_SCHEDULE=0 */3 * * *
      - DB_CONNECTION=sqlite
    volumes:
      - /mnt/server/speedtest-tracker/config:/config
    ports:
      - "8765:80"
    networks:
      - proxy

secrets:
  codex_home_token:
    file: ${HOME_SERVER_SECRETS_DIR:-/home/egouda/.config/home-server/secrets}/codex_home_token
  creative_password:
    file: ${HOME_SERVER_SECRETS_DIR:-/home/egouda/.config/home-server/secrets}/creative_password

networks:
  assistant:
    driver: bridge
  creative:
    driver: bridge
  proxy:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/24
