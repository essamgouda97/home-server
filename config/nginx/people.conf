server {
    listen 80;
    server_name people.home.egouda.xyz;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name people.home.egouda.xyz;
    ssl_certificate /etc/letsencrypt/live/household/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/household/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    resolver 127.0.0.11 valid=30s;
    client_max_body_size 8k;
    location / {
        include /data/nginx/custom/home-server/people-key.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://172.18.0.1:8766;
        proxy_read_timeout 190s;
    }
}
