services:

  footage-console:
    image: home-server/footage:local
    build: ./services/footage-station
    container_name: footage-console
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    environment:
      CONSOLE_ORIGIN: http://ingest.lan
    volumes:
      - ${CREATIVE_ROOT}:/creative:ro
      - ${CREATIVE_ROOT}/.footage-ingest:/creative/.footage-ingest
    networks: [proxy]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  footage-codex:
    image: home-server/footage:local
    build: ./services/footage-station
    container_name: footage-codex
    command: [python3, /app/worker.py]
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    volumes:
      - ${CREATIVE_ROOT}:/creative:ro
      - ${CREATIVE_ROOT}/.footage-ingest:/creative/.footage-ingest
      - ${HOME_SERVER_SECRETS_DIR}/footage-codex-auth:/home/node/.codex
    networks: [assistant]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: [CMD, python3, -c, "import os,time; assert time.time()-os.stat('/creative/.footage-ingest/worker.json').st_mtime<240"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Source is the private essamgouda97/life-dashboard repository, cloned over SSH.
  life-dashboard:
    image: home-server/life-dashboard:local
    build:
      context: ${LIFE_DASHBOARD_REPO:-../personal-finances}
    container_name: life-dashboard
    restart: unless-stopped
    user: "1000:1000"
    environment:
      LIFE_DASHBOARD_SERVER: "1"
      LIFE_DASHBOARD_ORIGINS: https://life.home.egouda.xyz,http://life.lan
      CONTENT_STUDIO_OTIO_PYTHON: /opt/life-python/bin/python
      FITBIT_AIR_STATE_PATH: /app/personal-finances/data/bridge/fitbit-live.json
      CODEX_HOME: /home/node/.codex
      LIFE_MAC_BRIDGE_SOCKET: /bridge/resolve.sock
      TZ: ${TZ:-America/Edmonton}
    ports: ["127.0.0.1:3030:3000"]
    volumes:
      - ${LIFE_DASHBOARD_DATA}/docs:/app/personal-finances/docs
      - ${LIFE_DASHBOARD_DATA}/data:/app/personal-finances/data
      - ${LIFE_DASHBOARD_DATA}/generated:/app/personal-finances/apps/web/public/generated
      - ${LIFE_DASHBOARD_REPO}/config:/app/personal-finances/config
      - ${LIFE_DASHBOARD_DATA}/codex:/home/node/.codex
      - ${LIFE_DASHBOARD_DATA}/bridge:/bridge
      - ${CREATIVE_ROOT}:/Volumes/Creative
    networks: [proxy]
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 3g
    cpus: 3
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/data-version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  life-dashboard-sync:
    image: home-server/life-dashboard:local
    container_name: life-dashboard-sync
    restart: unless-stopped
    user: "1000:1000"
    command: [python3, /app/personal-finances/scripts/watch_docs.py]
    network_mode: none
    volumes:
      - ${LIFE_DASHBOARD_DATA}/docs:/app/personal-finances/docs:ro
      - ${LIFE_DASHBOARD_DATA}/data:/app/personal-finances/data
      - ${LIFE_DASHBOARD_DATA}/generated:/app/personal-finances/apps/web/public/generated
      - ${LIFE_DASHBOARD_REPO}/config:/app/personal-finances/config:ro
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 3g
    cpus: 2
    healthcheck:
      test: [CMD, python3, -c, "import os,time; p='/app/personal-finances/data/document-sync-status.json'; assert time.time()-os.stat(p).st_mtime<1800"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  life-dashboard-health:
    image: home-server/life-dashboard:local
    container_name: life-dashboard-health
    restart: unless-stopped
    stop_grace_period: 120s
    user: "1000:1000"
    command: [python3, /app/personal-finances/scripts/watch_health.py]
    volumes:
      - ${LIFE_DASHBOARD_DATA}/data:/app/personal-finances/data
      - ${LIFE_DASHBOARD_REPO}/config:/app/personal-finances/config:ro
      - ${HOME_SERVER_SECRETS_DIR}/life-dashboard-health:/run/secrets/health
    networks: [assistant]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 2g
    cpus: 1
    healthcheck:
      test: [CMD, python3, -c, "import os,time; assert time.time()-os.stat('/app/personal-finances/data/health-worker-heartbeat').st_mtime<7200"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 7200s

  # ─── CREATIVE STORAGE AND SMART HOME ────────────────
  creative-init:
    image: home-server/samba:local
    build: ./containers/samba
    profiles: [setup]
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        install -d -o 1000 -g 1000 -m 0770 /creative
        for folder in Projects Assets Exports ProjectBackups Incoming; do
          install -d -o 1000 -g 1000 -m 0770 "/creative/$$folder"
        done
        install -d -o 1000 -g 1000 -m 0700 /state/filebrowser /state/samba /state/homeassistant
    volumes:
      - ${CREATIVE_ROOT:-/srv/mergerfs/ssd/creative}:/creative
      - ${SERVER_DATA_DIR:-/mnt/server}/filebrowser:/state/filebrowser
      - ${SERVER_DATA_DIR:-/mnt/server}/samba:/state/samba
      - ${SERVER_DATA_DIR:-/mnt/server}/homeassistant:/state/homeassistant

  samba:
    build: ./containers/samba
    image: home-server/samba:local
    container_name: samba
    restart: unless-stopped
    ports:
      - "${SERVER_IP:-10.0.0.182}:445:445"
    volumes:
      - ${LIFE_DASHBOARD_DATA}/docs:/shares/LifeDashboard/docs
      - type: bind
        source: ${CREATIVE_ROOT:-/srv/mergerfs/ssd/creative}
        target: /shares/Creative
        bind:
          create_host_path: false
      - ./config/samba/smb.conf:/etc/samba/smb.conf:ro
      - ${SERVER_DATA_DIR:-/mnt/server}/samba:/var/lib/samba
    secrets:
      - creative_password
    networks:
      - creative
    healthcheck:
      test: ["CMD-SHELL", "smbcontrol smbd ping >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

  filebrowser:
    image: filebrowser/filebrowser:v2.63.23@sha256:a469ea076d4a1b4b1d86a41d130f2f536cd9da996a2b1fb39c0d7635f9d89b9a
    container_name: filebrowser
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    entrypoint: ["/bin/filebrowser"]
    command: ["--config", "/config/settings.json"]
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - type: bind
        source: ./config/filebrowser/catalog
        target: /srv
        read_only: true
        bind:
          create_host_path: false
      - ${LIFE_DASHBOARD_DATA}/docs:/srv/LifeDashboard/docs
      - type: bind
        source: ${CREATIVE_ROOT:-/srv/mergerfs/ssd/creative}
        target: /srv/Creative
        bind:
          create_host_path: false
      - type: bind
        source: ${SERVER_HOME:-/home/egouda}/workspace
        target: /srv/Code
        bind:
          create_host_path: false
      - type: bind
        source: ${SERVER_HOME:-/home/egouda}/repos
        target: /srv/Repositories
        bind:
          create_host_path: false
      - type: bind
        source: ${SERVER_DATA_DIR:-/mnt/server}/media
        target: /srv/Media
        bind:
          create_host_path: false
      - type: bind
        source: ${SERVER_DATA_DIR:-/mnt/server}/downloads
        target: /srv/Downloads
        bind:
          create_host_path: false
      - type: bind
        source: ${SERVER_HOME:-/home/egouda}
        target: /srv/Home
        bind:
          create_host_path: false
      - type: bind
        source: ${SERVER_STORAGE:-/mnt}
        target: /srv/Storage
        bind:
          create_host_path: false
      - ${SERVER_DATA_DIR:-/mnt/server}/filebrowser:/database
      - ./config/filebrowser/settings.json:/config/settings.json:ro
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  whisper:
    image: rhasspy/wyoming-whisper:3.8.1@sha256:ba6fcb6056ebe237d15a325381763a80af2fc8fcedaa04f6a714a7375eb20d80
    container_name: whisper
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    command: ["--model", "${WHISPER_MODEL:-small.en}", "--language", "${VOICE_LANGUAGE:-en}", "--compute-type", "int8", "--cpu-threads", "4", "--beam-size", "1", "--vad-filter", "--local-files-only"]
    environment:
      HOME: /tmp
      HF_HUB_OFFLINE: "1"
    volumes:
      - type: bind
        source: ${SERVER_DATA_DIR:-/mnt/server}/voice/whisper
        target: /data
        bind:
          create_host_path: false
    tmpfs: ["/tmp:rw,nosuid,nodev,size=256m,mode=1777"]
    networks:
      voice:
        ipv4_address: ${WHISPER_HOST:-172.22.0.2}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 3g
    cpus: 4

  piper:
    image: rhasspy/wyoming-piper:2.5.2@sha256:7d39aafac409c2b6b09d999ed04d84c311d632e558b35baa60fad6aac722af7a
    container_name: piper
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    command: ["--voice", "${PIPER_VOICE:-en_US-lessac-high}", "--local-files-only"]
    environment:
      HOME: /tmp
      HF_HUB_OFFLINE: "1"
    volumes:
      - type: bind
        source: ${SERVER_DATA_DIR:-/mnt/server}/voice/piper
        target: /data
        bind:
          create_host_path: false
    tmpfs: ["/tmp:rw,nosuid,nodev,size=128m,mode=1777"]
    networks:
      voice:
        ipv4_address: ${PIPER_HOST:-172.22.0.3}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 2

  codex-home:
    build: ./containers/codex-home
    image: home-server/codex-home:local
    container_name: codex-home
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    ports:
      - "127.0.0.1:18790:18790"
    volumes:
      - ${HOME_SERVER_SECRETS_DIR:-/home/egouda/.config/home-server/secrets}/codex-home-auth:/home/node/.codex
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
      - /agent:rw,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0700
    secrets:
      - codex_home_token
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks:
      - assistant
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.9.2@sha256:a1bc133af84ee6505fe2c266d9805b7c75b780dfdc188edfee3b11e8f3cd8efe
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 60s
    environment:
      TZ: ${TZ:-America/Edmonton}
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/homeassistant:/config
      - ./config/homeassistant/configuration.yaml:/config/configuration.yaml:ro
      - ./config/homeassistant/packages:/config/packages:ro
      - ./config/homeassistant/blueprints:/config/blueprints/automation/home-server:ro
      - ./config/homeassistant/custom_components/codex_home:/config/custom_components/codex_home:ro
      - /etc/localtime:/etc/localtime:ro
    secrets:
      - codex_home_token
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://${SERVER_IP:-10.0.0.182}:8123/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ─── VPN ────────────────────────────────────────────
  vpn:
    container_name: vpn-gateway
    image: dperson/openvpn-client@sha256:d174047b57d51734143325ad7395210643025e6516ba60a937e9319dbb462293
    restart: unless-stopped
    ports:
      - "127.0.0.1:90:80"
      - "127.0.0.1:6881:6881"
      - "127.0.0.1:6881:6881/udp"
      - "127.0.0.1:15080:15080"
      - "127.0.0.1:1080:1080"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    cap_add:
      - NET_ADMIN
    devices:
      - '/dev/net/tun:/dev/net/tun:rwm'
    environment:
      FIREWALL: ''
      PUID: 1000
      PGID: 1000
      TZ: UTC+0
      ROUTE: '${LAN_SUBNET:-10.0.0.0/24}'
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - label:disable
    stdin_open: true
    tty: true
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/vpn:/vpn

  # ─── INFRASTRUCTURE ─────────────────────────────────
  portainer:
    image: portainer/portainer-ce@sha256:511f3f06c96fe3b993ebeaafde311c1959cae73a7ef825dba6397d51b450dffa
    container_name: portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SERVER_DATA_DIR:-/mnt/server}/portainer/data:/data
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - proxy
    restart: unless-stopped

  npm:
    image: jc21/nginx-proxy-manager@sha256:52b2c59994f3d36acfcf70a1626f29734df0ed8c71bacc0269f78b6f939858bb
    container_name: npm
    restart: unless-stopped
    depends_on:
      dnsmasq:
        condition: service_healthy
    ports:
      - "${SERVER_IP:-10.0.0.182}:80:80"
      - "${SERVER_IP:-10.0.0.182}:443:443"
      - "127.0.0.1:81:81"        # Admin UI
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/npm/data:/data
      - ${SERVER_DATA_DIR:-/mnt/server}/npm/letsencrypt:/etc/letsencrypt
    networks:
      - proxy
      - canvas

  dnsmasq:
    image: jpillora/dnsmasq@sha256:98b69ad825942089fb7c4b9153e3c5af0205eda3a103c691e30b1a13fd912830
    container_name: dnsmasq
    restart: "no"  # managed by systemd (dnsmasq-docker.service) to ensure network is ready
    # This image's BusyBox nslookup uses resolv.conf even with a server argument.
    dns:
      - 127.0.0.1
    ports:
      - "${SERVER_IP:-10.0.0.182}:53:53/udp"
      - "${SERVER_IP:-10.0.0.182}:53:53/tcp"
      - "127.0.0.1:5380:8080"    # Admin UI through SSH tunnel
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "nslookup home.lan 127.0.0.1 >/dev/null 2>&1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - proxy

  watchtower:
    image: containrrr/watchtower@sha256:6dd50763bbd632a83cb154d5451700530d1e44200b268a4e9488fefdfcf2b038
    container_name: watchtower
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Edmonton}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * *   # 4 AM daily
      - WATCHTOWER_NOTIFICATIONS=shoutrrr
      - WATCHTOWER_MONITOR_ONLY=true       # Notify only, don't auto-update
      - DOCKER_API_VERSION=1.44            # Compatible with Docker Engine 29
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - proxy

  homarr:
    image: ghcr.io/homarr-labs/homarr@sha256:1f5b892aeef4ad0a4907f075777bbd0ce7120f4cdc53b9f3f028519250421aed
    container_name: homarr
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:7575"
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/homarr/appdata:/appdata
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=America/Edmonton
      - AUTH_PROVIDER=credentials
      - AUTH_SECRET=${HOMARR_AUTH_SECRET}
      - SECRET_ENCRYPTION_KEY=${HOMARR_ENCRYPTION_KEY}
    networks:
      - proxy
      - canvas

  uptime-kuma:
    image: louislam/uptime-kuma@sha256:3d632903e6af34139a37f18055c4f1bfd9b7205ae1138f1e5e8940ddc1d176f9
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/uptimekuma/data:/app/data
    networks:
      - proxy

  # ─── MEDIA MANAGEMENT ──────────────────────────────
  sonarr:
    image: linuxserver/sonarr@sha256:82172b363f9eddc02aca544f880a044f2ceb9aaf190bc87e4454e2f705eb91d0
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-America/Edmonton}
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/sonarr/data:/config
      - ${SERVER_DATA_DIR:-/mnt/server}/media/tvshows:/tv
      - ${SERVER_DATA_DIR:-/mnt/server}/downloads:/downloads
    ports:
      - "127.0.0.1:8989:8989"
    networks:
      - proxy
    restart: unless-stopped

  radarr:
    image: linuxserver/radarr@sha256:fe051413dfd91b383ba04910552e83fb0306895fefee275c48dafe7bb90807dc
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-America/Edmonton}
      - UMASK=022
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/radarr/config:/config
      - ${SERVER_DATA_DIR:-/mnt/server}/media/movies:/movies
      - ${SERVER_DATA_DIR:-/mnt/server}/downloads:/downloads
    ports:
      - "127.0.0.1:7878:7878"
    networks:
      - proxy
    restart: unless-stopped

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr@sha256:791bdc0d2a35b0f24b89a0b14159591269ef070f19fcccfc5fb518a863141373
    container_name: recyclarr
    restart: unless-stopped
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/recyclarr/config:/config
    environment:
      - TZ=${TZ:-America/Edmonton}
    networks:
      - proxy

  # ─── MEDIA STREAMING ───────────────────────────────
  jellyfin:
    image: ghcr.io/linuxserver/jellyfin@sha256:4ee07757abcaa0b74fbc74179392311dc2874c03b0bef04bc2d79e9e1a875793
    container_name: jellyfin
    runtime: nvidia
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-America/Edmonton}
      - UMASK_SET=022
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/jellyfin/config:/config
      - ${SERVER_DATA_DIR:-/mnt/server}/media/tvshows:/data/tvshows
      - ${SERVER_DATA_DIR:-/mnt/server}/media/movies:/data/movies
      - ${SERVER_DATA_DIR:-/mnt/server}/media/m3u:/data/m3u
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "${SERVER_IP:-10.0.0.182}:8096:8096"
      - "127.0.0.1:8096:8096"
    networks:
      - proxy
    restart: always

  jellyfin-vue:
    image: jellyfin/jellyfin-vue@sha256:73dbf74dcf2d9d17f71070658caf48404d7d981268da982dad65c141c48b9a46
    container_name: jellyfin-vue
    restart: unless-stopped
    ports:
      - "127.0.0.1:8097:80"
    networks:
      - proxy

  jellyseerr:
    image: fallenbagel/jellyseerr@sha256:4538137bc5af902dece165f2bf73776d9cf4eafb6dd714670724af8f3eb77764
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ:-America/Edmonton}
      - PORT=5055
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/jellyseerr/config:/app/config
    ports:
      - "127.0.0.1:5055:5055"
    networks:
      - proxy
    restart: always

  # ─── DOWNLOAD CLIENTS ──────────────────────────────
  qbittorrent:
    image: linuxserver/qbittorrent@sha256:2be038f3421f60f62e8e4bf201f66f385b68e4fbc9ed3ab79051069ea22e2650
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK_SET=022
      - WEBUI_PORT=15080
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/qbittorrent/config:/config
      - ${SERVER_DATA_DIR:-/mnt/server}/downloads:/downloads
    network_mode: "service:vpn"
    depends_on:
      - vpn
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped

  nzbget:
