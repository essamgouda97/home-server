server {
    listen 80;
    server_name auth.home.egouda.xyz auth.lan;
    return 308 https://auth.home.egouda.xyz$request_uri;
}
server {
    listen 443 ssl;
    server_name auth.home.egouda.xyz;
    ssl_certificate /etc/letsencrypt/live/household/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/household/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_request off;
    location / {
        resolver 127.0.0.11 valid=30s;
        set $auth_backend http://home-authelia:9091;
        proxy_pass $auth_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 120s;
    }
}
