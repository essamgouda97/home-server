# Server configuration — edit these paths for your environment
# Sourced by all scripts and the Makefile

# Where service data lives (media, downloads, agent state, service configs)
SERVER_DATA_DIR=/mnt/server

# Timezone for all services
TZ=America/Edmonton

# Router DHCP reservation for the wired home-server interface
SERVER_IP=10.0.0.182
LAN_SUBNET=10.0.0.0/24

# Creative originals stay on the SSD branch, outside the mixed media pool.
CREATIVE_ROOT=/srv/mergerfs/ssd/creative
HOME_SERVER_SECRETS_DIR=/home/egouda/.config/home-server/secrets
SERVER_HOME=/home/egouda
SERVER_STORAGE=/mnt

# Local speech engines; runtime containers cannot access the internet.
VOICE_LANGUAGE=en
WHISPER_MODEL=small.en
PIPER_VOICE=en_US-lessac-high
VOICE_SUBNET=172.22.0.0/16
WHISPER_HOST=172.22.0.2
PIPER_HOST=172.22.0.3

# This repo's location (auto-detected if left empty)
# REPO_DIR=/home/egouda/workspace/home-server
