# Only Nginx may invoke this endpoint. Never accept client identity headers.
location = /internal/authelia/authz {
    internal;
    auth_request off;
    resolver 127.0.0.11 valid=30s;
    set $home_auth_backend http://home-authelia:9091/api/authz/auth-request;
    proxy_pass $home_auth_backend;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Connection "";
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URL $scheme://$host$request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}
auth_request /internal/authelia/authz;
auth_request_set $home_user $upstream_http_remote_user;
auth_request_set $home_groups $upstream_http_remote_groups;
auth_request_set $home_name $upstream_http_remote_name;
auth_request_set $home_email $upstream_http_remote_email;
auth_request_set $home_login_url $upstream_http_location;
error_page 401 =302 $home_login_url;
