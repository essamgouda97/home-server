name: shared-workspace
services:
  workspace:
    build:
      context: ./services/workspace
      network: none
    container_name: shared-workspace
    restart: unless-stopped
    user: '1000:1000'
    environment:
      WORKSPACE_ORIGIN: https://workspace.egouda.xyz
      PAPERLESS_ORIGIN: http://workspace-paperless:8000
    volumes:
      - /srv/mergerfs/ssd/shared-workspace/app:/data
      - /srv/mergerfs/ssd/shared-workspace/jobs:/jobs
      - /home/egouda/.config/home-server/secrets/workspace/app:/run/secrets:ro
      - ./config:/policy:ro
    networks: [edge, documents]
    read_only: true
    tmpfs: ['/tmp:size=128m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 1
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.2.1@sha256:5fa76604a81df6945086e0837b14b56543d137e8ce4f311cc5d9ebe907e74e79
    container_name: workspace-paperless
    restart: unless-stopped
    depends_on: [broker, tika, gotenberg]
    env_file: /home/egouda/.config/home-server/secrets/workspace/paperless.env
    environment:
      PAPERLESS_REDIS: redis://workspace-broker:6379
      PAPERLESS_DBENGINE: sqlite
      PAPERLESS_URL: https://workspace.egouda.xyz
      PAPERLESS_ALLOWED_HOSTS: workspace-paperless,localhost,127.0.0.1
      PAPERLESS_TIME_ZONE: America/Edmonton
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_TASK_WORKERS: '1'
      PAPERLESS_THREADS_PER_WORKER: '2'
      PAPERLESS_WEBSERVER_WORKERS: '1'
      PAPERLESS_TIKA_ENABLED: '1'
      PAPERLESS_TIKA_ENDPOINT: http://workspace-tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://workspace-gotenberg:3000
      PAPERLESS_ENABLE_HTTP_REMOTE_USER: 'false'
      PAPERLESS_ENABLE_HTTP_REMOTE_USER_API: 'false'
      PAPERLESS_TRASH_DELAY: '365'
      PAPERLESS_CONSUMER_POLLING: '30'
      PAPERLESS_ENABLE_UPDATE_CHECK: 'false'
    volumes:
      - /srv/mergerfs/ssd/shared-workspace/paperless/data:/usr/src/paperless/data
      - /srv/mergerfs/ssd/shared-workspace/paperless/media:/usr/src/paperless/media
      - /srv/mergerfs/ssd/shared-workspace/paperless/consume:/usr/src/paperless/consume
      - /srv/mergerfs/ssd/shared-workspace/paperless/export:/usr/src/paperless/export
    networks: [documents]
    mem_limit: 2g
    cpus: 2
    security_opt: [no-new-privileges:true]
  broker:
    image: valkey/valkey:9-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    container_name: workspace-broker
    restart: unless-stopped
    user: '1000:1000'
    command: [valkey-server, --appendonly, 'yes']
    volumes: ['/srv/mergerfs/ssd/shared-workspace/broker:/data']
    networks: [documents]
    mem_limit: 128m
    security_opt: [no-new-privileges:true]
  tika:
    image: apache/tika:3.3.1.0@sha256:90b7fa1dc018434075fce9e1d9b88b1e3d0ea6979d0cf86e116c79a8073ae973
    container_name: workspace-tika
    restart: unless-stopped
    networks: [documents]
    mem_limit: 768m
    cpus: 1
    security_opt: [no-new-privileges:true]
  gotenberg:
    image: gotenberg/gotenberg:8.37@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769
    container_name: workspace-gotenberg
    restart: unless-stopped
    command: [gotenberg, '--chromium-disable-javascript=true', '--chromium-allow-list=file:///tmp/.*']
    networks: [documents]
    mem_limit: 512m
    cpus: 1
    security_opt: [no-new-privileges:true]
networks:
  edge:
    name: shared-workspace_edge
    internal: true
  documents:
    name: shared-workspace_documents
    internal: true
