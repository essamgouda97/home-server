# Applied in EACH proxy location; Nginx does not merge proxy_set_header levels.
proxy_set_header Remote-User $home_user;
proxy_set_header Remote-Groups $home_groups;
proxy_set_header Remote-Name $home_name;
proxy_set_header Remote-Email $home_email;
proxy_set_header X-Forwarded-User $home_user;
proxy_set_header X-Forwarded-Groups $home_groups;
proxy_set_header X-Forwarded-Email $home_email;
proxy_set_header X-Auth-Request-User $home_user;
proxy_set_header X-Auth-Request-Email $home_email;
