server {
    listen 80;
    server_name coach.home.egouda.xyz;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name coach.home.egouda.xyz;
    ssl_certificate /etc/letsencrypt/live/household/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/household/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128k;
    resolver 127.0.0.11 valid=30s;
    location / {
        set $coach_backend http://health-coach:8099;
        proxy_pass $coach_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
