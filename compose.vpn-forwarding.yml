name: home-server

# Opt-in overlay for a port-forwarding Proton VPN connection. Do not run this
# file without the base docker-compose.yml and a validated private env file.
services:
  vpn:
    image: qmcgaw/gluetun:v3.40.0@sha256:2b42bfa046757145a5155acece417b65b4443c8033fb88661a8e9dcf7fda5a00
    env_file:
      - ${PROTONVPN_ENV_FILE:-/home/egouda/.config/home-server/secrets/protonvpn.env}
    dns: !override
      - 127.0.0.1
    environment:
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      SERVER_COUNTRIES: Canada
      PORT_FORWARD_ONLY: 'on'
      VPN_PORT_FORWARDING: 'on'
      VPN_PORT_FORWARDING_STATUS_FILE: /gluetun/forwarded_port
      FIREWALL_INPUT_PORTS: 80,1080,15080
      FIREWALL_OUTBOUND_SUBNETS: ${LAN_SUBNET:-10.0.0.0/24}
      TZ: ${TZ:-America/Edmonton}
    volumes:
      - ${SERVER_DATA_DIR:-/mnt/server}/vpn/gluetun:/gluetun
