limit_req_zone $binary_remote_addr zone=workspace_connect:1m rate=2r/s;
map "$request_method:$http_origin" $workspace_join_ok {
    default 0;
    ~^GET: 1;
    "POST:https://workspace.egouda.xyz" 1;
}
server {
    listen 80;
    server_name workspace.egouda.xyz;
    return 308 https://workspace.egouda.xyz$request_uri;
}
server {
    listen 443 ssl;
    server_name workspace.egouda.xyz;
    ssl_certificate /etc/letsencrypt/live/household/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/household/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set_real_ip_from 192.168.240.2;
    real_ip_header CF-Connecting-IP;
    resolver 127.0.0.11 valid=30s;
    client_max_body_size 51m;
    client_body_timeout 30s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Link '<https://workspace.egouda.xyz/.well-known/agent.json>; rel="service-desc"; type="application/json", <https://workspace.egouda.xyz/openapi.json>; rel="service-desc"; type="application/vnd.oai.openapi+json", <https://workspace.egouda.xyz/llms.txt>; rel="help"; type="text/plain"' always;
    location / {
        include /data/nginx/custom/home-server/workspace-key.conf;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        set $workspace_backend http://shared-workspace:8080;
        proxy_pass $workspace_backend;
        proxy_read_timeout 100s;
    }
}
